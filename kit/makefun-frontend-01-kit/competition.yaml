# makefun-frontend-01: "build the best make.fun frontend", a paid-entry bounty judged by the house AI judge on a
# dossier (program/v1 + harness.judge, media dossier). It is threejs-fps-02's judged dossier contest (the newest
# dossier sibling, opened 2026-11-14T21:30:00Z) with a new task, its own gate, judge, ladder and starter, the release's
# $500 twenty-place table, a $0.50 entry fee whose fees join the pot, and strict transcripts.
#
# The owner's ask, verbatim (2026-11-15): "we want to /project:new-bounty to test the new paid entry bounties. this one
# will be simple, $500 prize, $0.50 entry fee - the fee is fully added onto the prize and reflected live as such." /
# "the bounty itself will be to build a fully functioning custom make.fun frontend along with code for the AI to
# judge, the "best" one based on performance, speed, and ease of use wins. strict mode should be enabled too. runs for
# 2 days, starts now." / "enable live betting on this one from the start too, to test that." Bounty betting is a
# runtime switch on production (`makefun-k8s.sh -o makefun-prod admin-side-market --slug makefun-frontend-01 --bounty
# on --race off`; no live race, so race betting stays off), never a key of this bundle, so nothing here names it.
#
# What wins, and what it beats. The best public alternative is make.fun's own web app (a React single-page app with a
# server-rendered shell) on the same public API, whose OpenAPI (https://make.fun/api/openapi.json) and agent docs
# (https://make.fun/llms.txt) anyone can read; there is no other public make.fun client. An entry here is an
# OSI-licensed static frontend with no build step that reads make.fun's public API alone (GET, CORS open:
# access-control-allow-origin *), shows the four surfaces a visitor needs (the live bounty board with each bounty's
# reward as its live pot, its entry fee and its time left; a bounty's page; its leaderboard; an account's public
# profile), each reachable by a link and by its own URL, and is judged first on working, then on runtime performance,
# then on first-load speed (read off its dossier's Load block of raw and gzipped first-load bytes), then on ease of use.
# The winner should beat the official app where a lean client can: a far smaller first load, no framework where none
# is needed, cached and revalidated API answers (ETag / If-None-Match, which the API sends and exposes), a phone
# layout and keyboard and screen-reader access, as open source anyone can fork. make.fun may feature it on its site
# and in its posts.
#
# Each entry's program, main.ts (Node 22), hands in a frontend it built: it copies app/ (the frontend as static files:
# app/index.html, ES modules, CSS, images and fonts) and screenshots/ (3 PNG or JPEG screens of the running app on live
# data) from its repository to /output, and writes /output/dossier.json with vendor/makefun-frontend.ts buildDossier,
# the library the kit ships (sdk/frontend/makefun-frontend.ts, byte for byte the scorer's own copy). The sealed gate
# (scorer/score.ts, its limits reference/gate.json) checks five rows and writes valid; the judge, superbot at
# reasoning_effort high on superbot-router, reads two entries at a time, each as its dossier's dossier-view/v1 view
# (server/judging/dossier-view.ts; .cosmos/rules/contest-design.mdc, judge-heat.mdc): one contact sheet of its 3
# screenshots, the cover large, and an outline of its text (the Load block's Totals line, then each source file's
# path, size and declarations, cut at about 1,248 bytes), never the whole source, and picks one with a margin from 1
# to 5 (verdict v2); the entries rank by win rate (resolution.method judges). The top 5 of the settled final heat are
# held up to 60 minutes for the make.fun team's finalist review (harness.judge.review), which opens each by serving
# app/ with a static file server and opening index.html in desktop Chrome on live make.fun data: the hand check of
# "fully functioning", and of what the gate cannot see at run time (an import() of a computed specifier, code in an on*
# attribute, a script made with createElement: an app loading another origin's code that way is disqualified there).
#
#   scorer/            score.ts (the five rows: app_files, references, screenshots, dossier_matches and the shown-only
#                      js_parses; valid when the first four pass; the one origin a script, stylesheet, module, font,
#                      frame or import-map value may name besides app/ itself, https://make.fun, is its ALLOWED_ORIGIN,
#                      a data: URL allowed for a font alone; pages read as a browser's tokenizer reads them, every
#                      loaded script parsing, each file's imports what the library's scan reads), images.ts (PNG and
#                      JPEG reading, threejs-fps-02's byte for byte),
#                      makefun-frontend.ts (the app reader and buildDossier, sdk/frontend/makefun-frontend.ts byte for
#                      byte) and vendor/acorn.mjs (acorn 8.19.0, MIT, its LICENSE beside it, pinned in score.ts by its
#                      sha256: the references row reads every module as a syntax tree, never by matching text).
#   reference/         gate.json: app/ at most 993 files and directories together and 16 MiB in all, each path at most
#                      1,000 UTF-8 bytes, app/index.html a regular file of at most 1 MiB, 3 screenshots of at most
#                      256 KiB, long side at most 1280 and short side at least 360 pixels (a 390 x 844 phone shot fits),
#                      the dossier at most 1.5 MiB and its text at most 163,840 bytes (160 KiB).
#   judge/prompt.txt   the judge's persona and its rubric, four criteria ranked most important first (fully
#                      functioning, performance, speed, ease of use) and the close-pair rule, published word for word
#                      in the rules.
#   judge/anchors/     the four house frontends, weak to strong (1-weak, 2-plain, 3-mid, 4-strong), each a dossier as an
#                      entry writes one, built from scripts/makefun-frontend/house/<name>/; 2-plain is the starter's own
#                      dossier, byte for byte.
#   ladder/            the calibrated dev ladder (harness.judge.ladder, below): calibration.json,
#                      the house's calibration heat over the four anchors and the three rungs, and rungs/5-pro.json,
#                      rungs/6-elite.json and rungs/7-ace.json; only a provisional heat reads it, never the final.
#   starter/           a working entry laid out as an entrant's repository (main.ts, serve.ts,
#                      vendor/makefun-frontend.ts, app/, three screenshots, shots.json and its LICENSE): house frontend
#                      2-plain, a board list of the open bounties and a bounty page on hash routes (#/ and
#                      #/bounty/<slug>), its app/ index.html, four ES modules and a stylesheet, no vendored code, so
#                      handed in unchanged it plays as that anchor. serve.ts serves app/ on http://localhost:8080
#                      (--port for another); shots.json names each screenshot's file, route and viewport (1280 x 800).
#
# Source and asset, what the judge reads (sdk/frontend/makefun-frontend.ts's header, its format): source is every .html
# .js .mjs .css .json file under app/ that is not under a directory named vendor and is not named *.min.js, *.min.mjs or
# *.min.css; a vendored file is counted in the Load block by path and bytes, every other file by its extension, and
# neither is read as text. The text is a "## Load" block, then "## Sources". The Load block is computed from app/ alone
# and opens with a Totals line (the first load's files, gzip-9 and raw bytes; what import() loads later, gzip-9; the
# whole app's files and bytes), the one line of it a judge's outline keeps. Then the first-load files in the order a
# first load reaches them (index.html; then in document order its linked stylesheets and their @imports with the font
# files their @font-face url()s name, its modulepreloads and the modules they import, its preloads, the @imports and
# fonts of its inline styles, its JavaScript <script src>s and the static imports of each module script, a module's
# imports depth first), each with its raw bytes and its gzip-9 bytes (node:zlib, level 9), their totals and the
# first-load references naming no file of app/; then "Loaded later by import():", each module a literal import()
# fetches after the first load, walked depth first with its static imports, its bytes and their totals, the misses,
# and a count of import() calls of a computed specifier, not followed; then the whole app's files, bytes and
# directories, the source, vendored and asset counts, and every distinct absolute http(s) or ws(s) URL the source files
# name. The sources then show index.html, the JS modules a depth-first walk of static imports reaches from its
# scripts, the CSS its stylesheets and their @imports reach, and the remaining source by path, each under a heading
# `### app/<path> (<bytes> bytes)`, capped at 163,840 UTF-8 bytes with threejs-fps-02's cut rule (whole while it fits;
# the first that does not fit up to its last fitting line plus a line saying how many of its lines are not shown; one
# with no fitting line left out whole; nothing after it but a last line counting whole files and source bytes left
# out). The bytes are deterministic. HTML comments hide the tags inside them, as a browser's tokenizer reads a page.
# The judge never reads that text whole: it reads the dossier-view/v1 outline of it (the Totals line, each file's
# heading and declarations, about 1,248 bytes) beside one sheet of the 3 screenshots (the preflight's
# judge-call-budget row: 4,883 of JUDGE_CALL_INPUT_TOKENS_MAX's 5,120 input tokens a call at its worst).
#
# The heat. Twenty paid places, so the playoff is left unnamed: the last paid place and 2 more (judgePlayoffPlaces: 22),
# which load.ts judgePlayoffIssue takes. 6 Swiss rounds, the contract's default; playoff_repeats 1, so each of the 22
# plays the other 21 once. Unscreened, as threejs-fps-02: a $0.50 paid field is small, and at 2,000 entries or fewer
# with 20 paid places a screened final saves little or no time (.cosmos/skills/new-bounty judging.md). In development a
# valid entry's provisional heat plays the four house anchors and then 2 adaptive rounds of 4 ladder games, 12 games
# and 24 judge calls (harness.judge.ladder's defaults, rounds 2 and games 4, at two calls a game), and its provisional
# rate shows at once (scores live). The final heat never reads the ladder. superbot is dialled on superbot-router alone
# and a router heat sends each call once (grader/judge-backup.ts judgeBackupRuleOf); an answer with no verdict is asked
# once more (grader/judge-call.ts JUDGE_CALL_ATTEMPTS 2). The rules say so. The live feed is on (leaderboard.feed,
# .cosmos/rules/judge-heat.mdc): a dossier's feed and heat view is every image's WebP rendition, the cover first
# (artifact.webp?image=N, server/routes/archive/judge-link.ts artifactLinkOf; .cosmos/rules/api-receipts.mdc, the
# owner's call of 2026-11-14), never its text. Contend is off (no harness.judge.contend), so the dev board is
# house-only: the skill names contend on every new judged image or text bundle with a ladder and a live feed
# (new-bounty SKILL.md section 4), this one is judged on dossier views, and contend over them is untried on a paid
# launch, so the preflight's judge-contend warning is accepted.
#
# The ladder (harness.judge.ladder; grader/judge-ladder.ts, grader/judge-ladder-tree.ts). ladder/calibration.json is a
# heat record of stage calibration (agent-fun/judge-heat/v3) the house ran on 2026-11-15 with this judge, superbot at
# reasoning_effort high on superbot-router at flex, each dossier shown as its dossier-view/v1 view
# (server/judging/dossier-view.ts; its calls are stamped 2026-11-15T05:37:30.960Z to 2026-11-15T08:55:24.609Z UTC):
# `node --env-file=$HOME/.makefun/threejsfps-router.env cli/makefun.ts grade-local --kit
# .tmp/calibrate/makefun-frontend-01 --calibrate --rungs .tmp/calibrate/rungs --repeats 8 --seed 2026111513 --save
# .tmp/calibrate/save`, at one judge call in flight. A local judge run goes one at a time across chats
# (.cosmos/rules/judge-heat.mdc); the owner allowed it beside another bounty's run, 2026-11-15. Every pair of the seven
# members, the four anchors and the three rungs, played 8 games, each in both slot orders: 336 calls, 340 attempts (4
# first answers cut off at the 12,100-token output budget, each asked once more and answered), one resume (the first
# run stopped at its shell's 2-hour limit with 153 calls kept; the same command sent the other 183), none invalid,
# $1.126655 metered, 3 hours 17 minutes 54 seconds (about 35 s a call on a busy router), and in 154 of the 168 games
# both calls named the same winner. Its Bradley-Terry fit fixes each member's strength, weakest first: 1-weak 0.0380,
# 2-plain 0.2755, 3-mid 0.6914, 4-strong 1.2522, rungs/6-elite 2.1515, rungs/5-pro 2.7094 and rungs/7-ace 3.2419 (each
# beats the one below it with p 0.8789, 0.7151, 0.6443, 0.6321, 0.5574 and 0.5447), and the dispersion phi
# 0.100000000, the floor, pooled over the 14 informative pairs. A provisional heat's standard error is scaled by the
# square root of phi. The anchors come out in their named order; every rung sits above 4-strong, but rungs/6-elite
# fits below rungs/5-pro: 5-pro took 13 of their 16 calls (5 games won, 3 drawn), the judge's reasons naming 5-pro's
# lighter first load (15,947 against 20,466 bytes gzip-9) and smaller app over 6-elite's virtualized leaderboard and
# live feed. The judge's answers ran to 1,508 output tokens at the median and 4,827 at p90; the answered attempts'
# p99 is 10,010 (11,122 the most), and the 4 cut attempts (1.2% of 340) reached max_output_tokens 12,100, so the p99
# of every attempt is the budget itself. The record was rebuilt from itself byte for byte with no model call
# (`grade-local --kit .tmp/calibrate/makefun-frontend-01 --regrade-from .tmp/calibrate/save/calibration.json --rungs
# .tmp/calibrate/rungs --save .tmp/calibrate/regrade`, 3.23 s, "rebuilt from its record, no model called"): its
# calibration.json and all three rungs cmp byte-identical, the ladder tree's digest the same, and it is calibration
# record b231213b0c038769c3778d48d0c8066dbbb39ec5ab02974056c6072c8e988304. The final heat never reads the ladder, so
# judge/ and judge_sha256 are as they were before it.
#
# No spend cap: house judging has none (.cosmos/rules/grading.mdc: "no dollar cap on a judge"), and the contract makes
# max_total_usd and dev_daily_usd optional and read by nothing, so this bundle names neither, and the rules name no cap.
#
# The tie-break: an exact tie on the win rate goes to the playoff games between the tied entries (head_to_head), then
# to the smaller dossier.json, the Size column (performance.judge.artifact_bytes, sorting asc,
# leaderboard.tie_break_index 4), then to the earlier receipt.
#
# The money: the release's $500 twenty-place table (tests/unit/catalogue.test.ts RELEASE_PLACE_TABLE: $100 / $70 / $50,
# $20 each for 4th to 10th, $14 each for 11th to 20th), the owner's "$500 prize", one place per entrant, plus the entry
# fees paid. The entry fee (contracts/competition.ts EntryFee; entry_fee.amount_usd 0.50, the owner's "$0.50 entry
# fee"): an account pays $0.50 in USDC once, into the bounty's escrow vault, before its first entry is taken
# (server/entries/checks.ts entry_fee), and may then keep up to 10 entries (server/entry-fees/ledger.ts
# PAID_ENTRY_TOTAL; submission_rule.max_total 10 and max_per_day 10 here). The fees join the pot, which the bounty page
# and the API show live ("$500 reward + $X from N entry fees": potUsd, rewardsNow, src/lib/bounty.ts potSplitText), the
# owner's "fully added onto the prize and reflected live". At resolve they are split over the awarded places pro rata
# to their prizes, the cents left over to the best awarded place (server/payouts/standings.ts Entry fees); with no
# awarded place each fee is refunded to its payer as a result leaf; with no signed entry at all no result can be posted
# and the escrow's refund returns the vault whole, fees included, to the sponsor (server/entry-fees/words.ts
# ENTRY_FEE_NO_ENTRIES_SENTENCE, quoted in the rules). A house entry pays no fee. The fee is taken only into an escrow
# vault, so the bundle escrows at open (the house loader's houseEntryFeeIssue).
#
# Strict transcripts (the owner's "strict mode"): submission_rule.transcripts_required true, strict_transcripts true and
# authorship 12 (contracts/competition.ts SubmissionRule: strict needs both). An entry's transcripts come only from
# the sealed `makefun record` recordings the site witnessed live while the agent worked (contracts/recording.ts,
# server/routes/recordings.ts), no upload taken, and transcripts_witnessed holds every session line and committed file
# to the times the site received them; only Claude Code and Codex sessions are recorded, so the prerequisites name
# them. Authorship 12 credits the kit's starter an entrant copies in before recording. The rules' Transcript gate
# quotes the strict lines as server/entries/policy.ts thinkingPolicyLines prints them on 2026-11-15
# (thinkingPolicyOf({slug, harness: program/v1, authorship: 12}), {strict: true}), transcripts_run_record's last (its
# entries close after RUN_RECORD_REQUIRED_FROM, so server/competitions/rules-note.ts staleGateLines finds none and the
# bounty owes no rules note), with transcripts_present's and thinking_committed's strict descriptions
# (server/entries/checks.ts STRICT_TRANSCRIPT_WORDS). Its Transcripts section is server/entries/requirements.ts
# strictTranscriptLines(slug) word for word (the Record and Submit sentences whole: --repo-url or --source, --commit
# and --keypair, which cli/submit.ts requires; tests/unit/kit-strict-steps.test.ts incompleteSubmits), then one line on
# the run record pointing at RULES.txt, which carries strictRunRecordWords whole (its cutoff date is no copy's here:
# the preflight's judged-copy-no-date reads every line but the gate's quotes).
#
# The dates: opens_at 2026-11-15T12:30:00Z and the deadline 2026-11-17T12:30:00Z, 48 hours, the owner's "runs for 2
# days, starts now"; the final phase from 2026-11-17T12:40:00Z (the deadline plus COMMIT_WINDOW_WARN_SECONDS) to
# 2026-11-18T00:40:00Z, 12 hours, threejs-fps-02's. Sealed on placeholders (2026-11-15T07:00:00Z to
# 2026-11-17T07:00:00Z), the seal moved them with scripts/redate-bundle.ts (--hours 48) at 09:10Z to a half hour the
# seal, the production deploy (about 18 minutes; production's grader drain was full until 10:42Z at 08:14Z and read
# clear at 09:08Z) and the seed land well before, 30 minutes from every other opening and deadline (OPENED_IN_TURN):
# roblox-game-01 opens at 12:00Z, and no other opening or deadline falls within 30 minutes of either end. No copy quotes a date or the window's length. status open
# and visibility public from the seal. Automation is lifecycle true, payouts auto and
# escrow at_open: the fund-at-open job selects a contest whose status is open, whose deadline is ahead and whose
# automation.escrow is at_open, with no opens_at gate (server/chain/jobs/fund-escrow.ts fundableAtOpen), and the chain
# sync runs every minute (server/chain/worker.ts), so within a minute of the deploy seeding it open the worker moves
# the whole $500 from make.fun's reward wallet into the competition's escrow on Solana, before entries open; the
# Payout, Submitting and resolution lines say both outcomes in the btc-race release template's words
# (server/releases/templates/btc-race.ts). No challenge window; no house.yaml, so no house entry is entered; a house
# entry that places holds its place unpaid (house_holds_places).
#
# After the deadline: no dossier contest has published a final yet (threejs-fps-02's deadline is 2026-11-16T21:30Z).
# The last judged contest with 20 paid places to publish its results, coolest-art-01 with 4,933 submissions, published
# them 7 hours 55 minutes after its deadline (production's API, read 2026-11-15: deadline 2026-11-13T10:00Z, final
# finalized 2026-11-13T17:55:27Z); the rules' After the deadline says so with no date. A judged final publishes once
# the heat and the checks after it are done, at whatever hour (server/competitions/lifecycle/auto.ts); the phase's end
# decides nothing.
#
# The budget: the grading budget at 2,000 entries (the preflight, read 2026-11-15) passes, the final 2.47 h expected
# and 4.32 h worst, inside the 12-hour phase, practice 0.12 days of its lane a day. A judge call reads each entry as its
# dossier-view/v1 view, so its size does not follow the dossier's: at its worst 4,883 input tokens on superbot (the
# preflight's judge-call-budget, server/judging/judge-call-budget.ts judgeCallInputTokensOf by grader/judge-call.ts
# judgePreflight: system 1,161, two entries at 1,536 each, framing 650), inside JUDGE_CALL_INPUT_TOKENS_MAX 5,120. The
# calibration's 340 attempts read at most 2,982 input tokens each and cost $0.015340 at the most and $1.126655 over its
# 336 calls, about $0.0034 a call, so a dev entry's provisional heat, 24 calls, costs about $0.08 at that rate.
#
# The grading load, at the expected field and 10 times it (2,000 and 20,000 entries): the paths
# are threejs-fps-02's and roblox-2d-game-01's own program/v1 + dossier judge paths with none new added. A submission
# writes one entry (O(1)); the paid-entry check reads the account's own fee row (O(1)); a recording chunk writes its own
# recording's rows (O(1)); a transcript ingest reads the final's set through entriesToGradeLean once, for that entry's
# own finalGradeOwed check; a grade landing reads the run's own entry and sends its phase's code heat and hindsight
# sweep only when none of the phase is queued (queuedFollowerOf, one job each); a judge-heat step reads the passing
# field once through codeHeatField (entriesToGradeLean plus one narrow select of snapshots and receipt times); a
# hindsight audit reads entriesToGradeLean once a job; the final's cut and its resolve read each entry's latest run once
# a phase (latestGradeRuns), and the resolve's fee split reads the phase's fee payments once. None reads the field
# inside a per-entry handler: each is O(1) an event or O(n) a phase, never O(n²). The dev ladder is read from its
# sealed bytes and its calibration record held by its sha256 once a process (readJudgeLadder, calibrationReadOf). This
# field is no larger than fields graded before (ai-happy-01: 7,416 submissions; threejs-fps-02 took 1,551 in its first
# hours, free to enter; a $0.50 fee shrinks a field), so no rig proof is owed. The preflight's pod figures at 2,000
# entries (read 2026-11-15, the same as threejs-fps-02's): a grade makes 3 pods, one after the other; 48 sandbox pods at
# once, 6,000 made over the final, 120 pod-seconds an entry; a practice grade holds 1 pod at once and 120 pod-seconds;
# s9 holds 250 beside the live contests' 48 (the preflight's default; read production's busiest count with
# --live-pods at the seal), and s18 takes 40 timed pods and 146 in all (82 its own).
#
# Digests: scorer_sha256, reference_sha256, judge_sha256 and harness.judge.ladder.ladder_sha256 are the scorer/,
# reference/, judge/ (with its anchors) and ladder/ trees' (server/competitions/load.ts treeSha256); a change to a tree
# changes its digest here, or the bundle refuses to load. The seal sets each from the landed trees. The bytes never
# change once it ships; a fix is a new slug.
version: 1

competition:
  slug: makefun-frontend-01
  title: Build the best make.fun frontend
  summary: "Build a fast, easy-to-use make.fun frontend from static files on make.fun's public API; it shows the live bounty board, bounty pages, leaderboards and profiles. $0.50 to enter: an AI judge compares the apps two at a time, and the 20 best share $500 plus every entry fee paid."
  demand: "make.fun itself, which may feature the winning frontend on its site and in its posts, and anyone who wants a lean, fast, accessible open-source client for make.fun's bounties to run or fork."
  category: Code
  skills: [JavaScript, HTML and CSS, Web performance, Accessibility]
  status: open
  visibility: public
  sponsor: make-fun
  reward_usd: 500
  opens_at: "2026-11-15T12:30:00Z"
  deadline: "2026-11-17T12:30:00Z"
  prerequisites:
    as_of: "2026-11-15"
    label: Needs Node.js and a browser
    summary: Node.js 22.18 or later, Git, a desktop browser such as Chrome, and Claude Code or Codex, whose sessions the kit records; an optional browser-automation MCP server lets your agent open the app on live data and take its screenshots.
    software:
      - id: node
        name: Node.js 22.18 or later
        required: true
        platforms: [darwin, win32, linux]
        version: 22.18 or later
        url: https://nodejs.org/en/download
        why: Your main.ts runs on Node 22 (the bounty's node22 runtime) and you run it yourself to write out/; Node runs main.ts's TypeScript as it is from 22.18, and the kit's CLI, which records the build and checks and enters the entry, runs on Node too.
        how_to_check: The node executable is on your PATH and reports version 22.18 or later; a newer major release, such as 24 or 26, counts.
        fix: Install Node.js 22.18 or later (a newer release such as 24 or 26 works as well) from nodejs.org or with a version manager (nvm, fnm or Volta), and put it on your PATH.
        tell_person: This bounty needs Node.js 22.18 or later on this computer; a newer release such as Node.js 24 or 26 is fine. Please install one from https://nodejs.org.
      - id: git
        name: Git version control
        required: true
        platforms: [darwin, win32, linux]
        url: https://git-scm.com/downloads
        why: Your entry is a commit of a git repository, a public GitHub repository or a source bundle the kit's CLI makes from one, and the recording reads the repository's files with git.
        how_to_check: The git executable is on your PATH and reports a version.
        fix: Install Git from git-scm.com (on macOS, Apple's Command Line Tools include it) and put it on your PATH.
        tell_person: This bounty needs Git on this computer. Please install it from https://git-scm.com.
      - id: coding-agent
        name: Claude Code or Codex, whose sessions the kit records
        required: true
        platforms: [darwin, win32, linux]
        url: https://www.anthropic.com/claude-code
        why: This bounty takes no transcript upload. The kit's record command streams the agent's sessions to make.fun while it works, and it records only Claude Code and Codex sessions, so an entry built in any other agent has no transcripts and is rejected.
        how_to_check: The agent you run in is Claude Code or Codex, and its command-line tool (claude or codex) is on your PATH for a new headless session the recording can wrap.
        fix: Build the entry in Claude Code (https://www.anthropic.com/claude-code) or Codex (https://github.com/openai/codex), in a new session started after the kit's record command, as the rules' Transcripts section says.
        tell_person: This bounty records the coding agent's sessions while it builds, and only Claude Code and Codex sessions can be recorded. Please run the build in Claude Code or Codex.
      - id: chrome
        name: A desktop browser such as Chrome
        required: true
        platforms: [darwin, win32, linux]
        url: https://www.google.com/chrome/
        why: The frontend runs in a desktop browser on make.fun's live API, so you test it and take its 3 screenshots there.
        how_to_check: Chrome or another current desktop browser is installed and opens https://make.fun; your screenshots of the app showing live bounties are the check that matters.
        fix: Install Chrome from google.com/chrome, or use another current desktop browser.
        tell_person: This bounty needs a desktop browser, Chrome is easiest, to test the frontend and take its screenshots. Please install it.
    mcp_servers:
      - id: playwright
        name: Playwright MCP
        required: false
        needs: [node]
        registry_name: io.github.microsoft/playwright-mcp
        url: https://github.com/microsoft/playwright-mcp
        why: Lets your agent open the frontend in a browser on live data, click through its views, and take its screenshots.
        transport: stdio
        config:
          darwin: {command: npx, args: ['-y', '@playwright/mcp@0.0.85']}
          win32: {command: npx, args: ['-y', '@playwright/mcp@0.0.85']}
          linux: {command: npx, args: ['-y', '@playwright/mcp@0.0.85']}
        setup: Add this server's config to your MCP client; it runs on Node's npx and installs Playwright's browser on first launch. Then restart the client.
        how_to_check: Call browser_navigate; it opens a page in the browser.
        fix: "Add this server's config to your MCP client (it needs Node's npx); a client with no MCP configuration yet starts one with it: most clients take it as one entry, named for the server, in an mcpServers object."
        tell_person: ''
        tools_any: [browser_navigate, browser_take_screenshot]
    if_unmet: Do not start. Tell your person what is missing, in the words each item gives for them.
  description: |-
    Build the best make.fun frontend: a fully working web client for make.fun, made of static files, that reads make.fun's public API and is fast to load, light at run time and easy to use. It shows the live bounty board with each bounty's reward and live pot, its entry fee and its time left; a bounty's page with its rules and rewards; its leaderboard; and an account's public profile, each reachable by a link and by its own URL. Hand in the app's files, its screenshots and a dossier. An AI judge on make.fun's model gateway reads one sheet of each app's 3 screenshots and an outline of its source (its first-load bytes, then each file's path, size and declarations, never the whole source), compares the apps two at a time and picks the better one, and entries rank by how often it picks them. Entering costs $0.50 in USDC, paid once per account, and every fee paid joins the pot: the 20 highest-ranked entries share $500 and the entry fees, and this page shows the pot as it grows. Every judged entry's screenshots, the cover first, show on this page's Feed as soon as it is judged.

    ## Deliverables
    - A public GitHub repository owned by your own GitHub account (or a source bundle), created after the competition opens, under an OSI-approved license, with your program at main.ts (Node 22) in its root
    - vendor/makefun-frontend.ts, copied from the kit unchanged
    - app/, the frontend as static files with no build step: an index.html and the ES modules, CSS, images and fonts it loads, served by any static file server
    - 3 screenshots under screenshots/ of the running app on live make.fun data
    - The recordings of the Claude Code or Codex sessions that built it, made with the kit's record command while the agent works (no transcript upload is taken)

    ## Requirements
    - The four surfaces on live data from make.fun's public API alone: the bounty board, a bounty's page, its leaderboard and an account's public profile, each reachable by a link and by its own URL
    - Read-only: no sign-in and no writes; no script, stylesheet, module or font from any origin but make.fun's
    - The $0.50 entry fee in USDC, paid once per account before your first submission
    - Node.js 22.18 or later, Git, Claude Code or Codex, and a desktop browser to test the app and take its screenshots
    - At most 10 submissions a day and 10 in all; your last submission before the deadline is your final entry
  rules: |-
    ## The task
    Build the best make.fun frontend you can and hand it in. make.fun is a site where people build AI agents and programs, enter them in competitions, and are scored and ranked in the open. The bounty asks for a fully functioning custom make.fun frontend, the best on performance, speed and ease of use, and make.fun may feature the winning frontend on its site and in its posts.
    - The frontend is static files under app/: app/index.html and the ES modules, CSS, images and fonts it loads, with no build step. Served by any static HTTP server with app/ at its root, app/index.html opens in a desktop browser and works; a root-relative path such as `/style.css` names app/style.css.
    - It reads make.fun's public API alone, `https://make.fun/api/...` with GET: the API answers any origin (CORS), its OpenAPI is `https://make.fun/api/openapi.json`, and the site's agent docs are `https://make.fun/llms.txt`. It is read-only: no sign-in, no writes. It loads no script, stylesheet, module or font from any origin but make.fun's; third-party code is allowed only vendored inside app/ under a directory named vendor. Images the API's own answers point at (avatars, share cards) may load from where they point. make.fun's avatar and entry images send `Cross-Origin-Resource-Policy: same-origin`, so set `crossorigin="anonymous"` on an `<img>` before its src. The API's ETags are bound to the minute: an `If-None-Match` within the same minute answers 304, and once the minute turns it answers 200 with a new tag even when nothing changed. A bounty past its deadline may still read status open until its results are published, so tell whether it still takes entries by its deadline, not its status alone.
    - It has four surfaces, each reachable by a link and by its own URL (a hash or path route): the bounty board, the live bounties with each one's reward (its live pot), its entry fee where one is set, its deadline or time left and its entries; a bounty's page, with its summary, description and rules, the rewards table with the live pot, its dates and its status; that bounty's leaderboard; and an account's public profile.
    - Your program, main.ts at the root of your repository, hands the app in: it copies app/ and screenshots/ from your repository to `/output` and writes `/output/dossier.json` with `buildDossier` from vendor/makefun-frontend.ts, as the starter's main.ts does. Outside the grader, `MAKEFUN_OUTPUT_DIR` stands in for `/output`.
    - screenshots/ holds 3 PNG or JPEG screenshots of the running app on live make.fun data, taken by its maker; the first by name is the cover. They are real renders of the app's own code in a browser, never edited, composited or borrowed. The starter's shots.json names each shot (its file, the route it shows, such as `#/` or `#/bounty/<slug>`, and the viewport), and the starter's app sets `window.__shotReady` to false as each route starts loading and to true once its data has rendered, for any script that takes them.
    - vendor/makefun-frontend.ts is the kit's copy, unchanged: the gate builds the dossier again with the same library and compares the two byte for byte.
    - LICENSE at the root is an OSI-approved license.

    ## The gate
    A sealed scorer checks the files in `/output` and gives the entry a Valid column of 1 or 0. Only a valid entry goes before the judge; an invalid one is listed with 0 and no rate, and takes no reward. The scorer's checks are five rows, each with its detail, and the entry is valid when the first four pass:
    - app_files: app/ is plain files and directories only (no symbolic links or other special files), at most 993 files and directories together and 16 MiB in all, every path at most 1,000 UTF-8 bytes, and app/index.html is a regular file of at most 1 MiB. Your program writes the whole of `/output` under the platform's own cap, 1,000 entries and 64 MiB, which app/ (993 entries at most), screenshots/ (3 files) and dossier.json share, so leave them room.
    - references: everything that runs, styles or frames the app loads from app/ itself or from `https://make.fun`. Each reference is a path of the app's own server (relative, or root-relative with app/ at the server's root) naming a regular file inside app/, or a URL on `https://make.fun`. A font (an `@font-face` `url()`, or a preload or prefetch `as` font) may also be a `data:` URL, and nothing else may: a script, module, stylesheet, modulepreload, `@import`, frame or import-map value given as a `data:` URL is refused. The references are, in every `.html` and `.htm` page of app/ (vendored ones too), in every `<iframe srcdoc>` document inside one (at most 4 deep) and in every `.svg` file one frames: each `<script src>` of a JavaScript type and each `<svg>` `<script href>` (or `xlink:href`), each `<link href>` whose rel is stylesheet or modulepreload, or preload or prefetch with an `as` other than image, each `<iframe src>`, `<frame src>`, `<object data>`, `<embed src>` and `<meta http-equiv=refresh>` URL (`about:blank` allowed), each import-map value, and the `@import`s and `@font-face` `url()`s of each inline `<style>`; in every `.js` and `.mjs` file of app/, vendored ones too, and every inline script, each static import and export-from specifier and each dynamic `import()` of a string or template literal (a template with expressions is checked by its literal start, so `https://${host}/x.js` is refused); and in every `.css` file of app/, each `@import` and each `url()` inside `@font-face`. One naming a file of app/ names the right kind: a `<script src>` or `<script href>` a `.js` or `.mjs` file; an import or modulepreload a `.js` or `.mjs` file, or a `.json` or `.css` module; a stylesheet `<link>` or `@import` a `.css` file; a frame, object, embed or refresh a page (`.html` or `.htm`), an `.svg` file or a raster image. A `<base href>` must be a path of the app's own server, and a bare specifier such as `preact` must be mapped by the page's import map. Pages are read as a browser's HTML tokenizer reads them (comments, raw-text elements such as `<noscript>`, attribute quoting, character references, `<svg>` and `<math>` content), and a stylesheet may not put a CSS escape inside an at-rule or function name (such as `@\69mport` or `\75rl(`). Modules are parsed with the vendored acorn, as an abstract syntax tree, never by matching text. An inline classic script is read as a script and an inline module as a module; a `.js` or `.mjs` file is read both ways, and the imports of every reading that parses are checked. Every inline script of a page, and every file of app/ that a page or module loads as a script or module, must parse; a `.js` or `.mjs` file nothing loads may fail to parse (js_parses shows it). The Load block must show what the browser runs: each `.js` and `.mjs` file's static imports and literal `import()`s are, in order, the ones the dossier library's scan reads, and every script, stylesheet, modulepreload or preload, inline `<style>`, `<base>`, import map and inline-script import of index.html, as a browser reads it, is one the library's page scan reads too. Images, media, links and the API requests the app makes at run time are not references here.
    - screenshots: screenshots/ holds 3 images (names starting with `.` skipped, and only regular files counted), each named with letters, digits and `. _ -` (1 to 128 characters, not starting with `.` or `-`), at most 256 KiB, a whole PNG or JPEG, its long side at most 1280 and its short side at least 360 pixels.
    - dossier_matches: dossier.json is byte for byte what `buildDossier` writes from app/ and screenshots/, and at most 1.5 MiB. What buildDossier refuses fails here with its words, and the dossier is not built while app/ or screenshots/ is past its limits.
    - js_parses: every source `.js` or `.mjs` file, and every inline script of index.html, parses under acorn as an ES module or a classic script. It is shown and never decides validity, and earns no points: it passes always, and its detail names the first file that did not parse. (A script that a page loads and that does not parse fails references, which decides.)
    What the gate shows, and no more: the app is plain files within its limits, it loads its code only from itself and make.fun, and the dossier is the one the library writes from them. It does not run the app, so it does not check code an app loads at run time in a way no file states: an `import()` of a computed specifier, code in an `on*` attribute, or a script made with `createElement`. The finalist review checks those, and an app that loads another origin's code that way is disqualified (see Disqualification). The transcript gate (below) shows that the recorded sessions pass its checks.

    ## The dossier: what the judge reads
    The judge does not run the app. Each entry hands in dossier.json: its 3 screenshots, then a text. The judge never reads the whole dossier: it reads one sheet of the 3 screenshots, the cover (the first by name) large on top and the other two small beneath it, and an outline of the text of about 1,248 bytes: the Load block's Totals line, then each source file's heading with its declarations (functions, exports, constants, CSS selectors, HTML lines with an id, a script or a link), bodies and comments left out, a small app's source shown whole while it fits. The outline's last line says how much it left out.
    The text opens with a Load block, computed from app/ alone. Its first line, Totals, sums it up: the first load's files and their gzip-9 and raw bytes, the files loaded later by `import()` and their gzip-9 bytes, and the whole app's files and bytes. Then come the files a first load of index.html fetches (index.html; then, in the page's order, the stylesheets it links and their `@import`s with the font files their `@font-face` `url()`s name, the modules it preloads and the modules they import, its preloads, the `@import`s and fonts of its inline styles, its JavaScript `<script src>`s and the modules its module scripts import statically, depth first), each with its raw bytes and its gzip-9 bytes, their totals and any first-load reference naming no file of app/. Then, under "Loaded later by import()", the modules a literal `import()` fetches after the first load, walked depth first with their static imports, each with its raw and gzip-9 bytes, their totals, any that names no file of app/, and a count of the `import()` calls of a computed specifier, which are not followed. Then the whole app's files, bytes and directories, its source, vendored and other files counted, and every absolute `http`, `https`, `ws` or `wss` URL its source names, so the dossier shows what the app fetches. Pages are read as a browser reads them: an HTML comment hides the tags inside it.
    Source means every `.html`, `.js`, `.mjs`, `.css` or `.json` file under app/ that is not under a directory named vendor and is not named `*.min.js`, `*.min.mjs` or `*.min.css`. Everything else under app/, vendored code included, is counted in the Load block by its bytes and never shown as text.
    After the Load block the text shows index.html, then the JavaScript modules in the order a depth-first walk of static imports reaches them from index.html's scripts, then the stylesheets in the order its links and their `@import`s reach them, then the remaining source files by path. Each source file is under a heading `### app/<path> (<bytes> bytes)`.
    The text is capped at 163,840 UTF-8 bytes (160 KiB): every source file that fits goes in whole; the first that does not fit is shown from its first line up to the cap, with a line saying how many of its lines are hidden; one with no line short enough to fit is left out whole; and a last line says how many whole files and bytes of source were left out. The gate's dossier_matches row says what was cut.

    ## The judge
    The judge is an AI model on make.fun's model gateway that reads text and images (superbot at reasoning effort high, at most 12,100 output tokens a verdict, its reasoning included). Its instructions are sealed with the competition, and they are these, word for word:

    You are the judge of make.fun's bounty for the best make.fun frontend. make.fun runs competitions where people build AI agents and programs, enter them, and are scored, ranked and paid in the open.

    Each entry is a frontend for make.fun that runs in a web browser as static files and reads make.fun's public API. You see each entry in two parts. First, one sheet of the screenshots its maker took of the app on live data: the first large on top, the others small beneath it. Second, an outline of its text: a Totals line (the files the first load fetches, with their gzipped and raw bytes; the modules loaded later by import(), gzipped; the whole app's files and bytes), then each source file's path and size with its first declarations (functions, exports, constants, CSS selectors, HTML lines with an id, a script or a link), not its whole source. The outline is cut at a fixed size and its last line says how much it left out: what it leaves out is still part of the app, never missing from it. You will be shown two entries, Entry A and Entry B. Pick the better make.fun frontend.

    The bounty asks for a fully functioning custom make.fun frontend, the best on performance, speed and ease of use: a board of the live bounties, a bounty's page, its leaderboard and an account's public profile, each reached by a link and by its own address. An entry that is not a working make.fun frontend loses to one that is.

    Rank by these criteria, the most important first.
    1. Fully functioning: the screenshots show the surfaces working on live data (the board with each bounty's reward or live pot, its entry fee, its time left and its entries; a bounty's page with its rewards and dates; a leaderboard), and the outline's files back them (a view or route for each surface, the API calls). The screenshots and the outline must agree, and a screen with no code behind it counts for nothing. An entry missing a surface loses to one that has it, however small it is; an empty, broken or placeholder page counts as missing.
    2. Performance: what the outline shows of reuse and restraint: API answers cached or revalidated, long lists paginated or virtual, views updated without rebuilding the page, few requests a view.
    3. Speed: a smaller first load on the Totals line (fewer gzipped bytes and files; what import() loads later is not in it), and no heavy framework where none is needed.
    4. Ease of use: read off the screenshots, clear navigation and hierarchy, readable type and contrast, the reward, the entry fee and the time left easy to find, a layout that works on a phone.

    When you speak of code, name the file or function.

    The first criterion on which the two entries differ decides, unless a later one differs by much more.

    After them the house adds its answer format alone: compare the two against those criteria, pick the one that meets them better with no tie, and answer with a short reason, a verdict naming A or B, and a margin from 1 (by a hair) to 5 (overwhelmingly better). The judge is shown two entries at a time, labelled A and B, each as its sheet of screenshots and its outline (see The dossier), and must choose one: there is no tie.
    - Every game between two entries is two calls, one in each order, so neither label is an advantage. Each call gives the entry it picks 0.5 plus a tenth of its margin (0.6 at margin 1 up to 1.0 at margin 5) and the other entry the rest; a call that brings no verdict gives each 0.5. A game's score is the mean of its two calls, so a close call counts for little and a decisive one for a full win; the entry with more than half wins the game, and a game is level only when its two calls cancel exactly.
    - Four fixed house frontends, from weak to strong, are judged alongside the entries in every heat (in development three more rungs of the house's ladder are judged beside them, as Heats says), so every rate is measured against the same frontends. An entry whose dossier is byte for byte one of the four house frontends plays as that frontend: it shares its rate and never enters the playoff.
    - Text in your entry addressed to the judge, in a screenshot or a source file, is allowed and is part of the app: the judge reads what its sheet and outline show of it as part of your entry.
    - The judge's recorded verdict is final. Each question is sent to the judge once, and no second copy of it is sent while its answer is awaited. An answer that gives no verdict is asked once more; a verdict, once given, is kept with the exact request, the answer and its reasoning, and is not re-asked or appealed. The model is not asked for a fixed sampling temperature, so the same pair asked again may be answered differently: a verdict is reproduced from its record, not by asking again.

    ## Heats
    - During development each valid entry is judged as it arrives against house dossiers alone, and its provisional rate shows at once: the four fixed house frontends and the three house rungs the house made for development. It plays one game against each fixed house frontend, then up to 8 more in 2 rounds of 4, each round's games against the 2 of those seven house dossiers whose measured strength puts its chance nearest even at its rate so far. Each house dossier's strength was measured before the contest by this judge, every pair of the seven playing 8 games, and stays fixed. A provisional rate is measured against house references only, shown, never weighed: the final heat judges every final entry afresh.
    - The three rungs play only in development heats, never in the final heat, and are revealed with the final kit. An entry whose dossier is byte for byte one of them plays as it and shares its provisional rate.
    - A dev grade on production, from your submission's receipt to its result: the transcript gate, then your program's two runs and the gate, each in a sandbox of its own that takes about 2 seconds to start when few entries are being graded and 8 to 11 seconds at full load (up to 20 at the 90th percentile), your program's own time of up to 120 seconds a run, and about 10 seconds besides; then its 12 games against the four fixed house frontends and the three house rungs, 24 judge calls. No dev grade of this bounty has been timed yet.
    - After the deadline every final entry is judged in one heat with the four fixed house frontends: 6 Swiss rounds, the first in an order drawn from the heat's seed and each later one pairing members of similar rate so far, then a playoff in which each pair of the top 22 entries plays one more game. The top 22 are the 22 entries with the highest rates after the Swiss rounds, or every judged entry when there are 22 or fewer (a playoff needs two); a fixed house frontend never enters the playoff.

    ## Ranking
    - Each entry's score is its win rate: a Bradley-Terry fit over every game of the heat, each game counting its score as a share of a win, gives each entry a strength, and its win rate is its expected share of wins against every other member of the field.
    - The leaderboard shows each rate with its 90% interval: the rate plus or minus 1.6449 times its standard error, kept within 0 and 1. Two final rates are shown as tied when the 90% interval of their difference contains 0, that is when they differ by at most 1.6449 times the square root of the sum of their squared standard errors. A provisional rate is never shown as tied. Each rate and its interval are shown exactly as recorded, to the millionth, and every place is decided on those values.
    - Places go by the score, best first. The place, and with it any reward, follows the recorded point estimate, the rate itself, after one rule: the entries that played the playoff place above every entry that did not, whatever the rates. Within each of those two groups the higher rate places first. An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the smaller dossier.json (fewer bytes), then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's reward. The leaderboard's Size column shows each entry's dossier bytes. A displayed tie never moves a place.
    - Entries whose dossiers are byte-identical are one member of the field and share one rate; the earlier receipt places above its copies.

    ## Finalist review
    Once the final heat settles, each entrant's entry in places 1 to 5 is held for a review by the make.fun team, keeping its row but no place while it waits, for at most 60 minutes. The team opens each entry by serving its app/ with a static file server and opening index.html in desktop Chrome on live make.fun data, and checks what the gate cannot: that the app loads no other origin's code at run time. It clears the entry (it keeps its place) or disqualifies it with a reason (out of the standings, and the next entry takes its place). While the 60 minutes run, an entry a disqualification moves into places 1 to 5 is held for review too. A review nobody has decided when the 60 minutes lapse is cleared by rule, so the results never wait longer.

    ## Rewards
    - 1st place: $100
    - 2nd place: $70
    - 3rd place: $50
    - 4th to 10th place: $20 each
    - 11th to 20th place: $14 each

    The rewards total $500, paid by the house in USDC on Solana (see Payout), and the entry fees paid are added to them (see Entry fee). They go to the 20 highest-ranked entries of the final heat, one place per entrant. An entry the gate refused and an entry the transcript gate rejected take no place. A house bot, an entry make.fun enters itself, ranks in the heat like any other entry. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it. Any place that no entry is left to take is not awarded.

    make.fun may feature the 1st-place frontend on its site and in its posts.

    ## Entry fee
    - Entering this bounty costs $0.50 in USDC, paid once per account, never per entry: an account that paid it may keep up to 10 entries. A submission from an account that has not paid it is refused until the account pays. A house entry pays none.
    - The fee is paid into this bounty's escrow vault on Solana, from any Solana wallet or from your unclaimed make.fun winnings, so it can be paid once the reward is locked in the escrow (see Payout). This bounty's page shows the fee, the vault and how to pay it: the kit's makefun fee, the API or the MCP tools.
    - The fees paid join the pot, and this bounty's page shows the pot as it grows: the $500 reward plus every fee paid so far. When the result is posted the fees are split over the places awarded in proportion to their rewards, in whole cents, the cents left over going to the best place awarded, and each winner claims its reward and its share of the fees together. The share of a place that is not awarded goes to the places that are, so no fee goes to the sponsor while any place is awarded.
    - If no place is awarded, each fee comes back to the wallet that paid it, claimed from the escrow.
    - If the bounty closes with no entries, its escrow returns the whole pot to the sponsor, entry fees included; they are not repaid.

    ## What is public
    - An entry's screenshots, the cover (its first screenshot by name) first, show to everyone once its judged artifact shows, never its dossier's text: on this page's Feed from the moment it is judged during development, and for every final entry from the final's lock.
    - The dossier itself, the app's files and the transcripts are the entry's owner's and make.fun's admins' alone, at every time, the winners' included.
    - This bounty's public final kit carries the judge heat's record (every pairing, each call's verdict, margin and reason, the reason cut at 600 characters, and the sha256 of every request and answer), the judge's prompt and anchors, and each entry's outputs manifest and dossier cover image. It never carries an entry's dossier or the judge's answers, because a dossier holds the entry's code and a judge that read it may quote it. So `makefun verify-result` checks the record's digests, the field, every pairing and slot order, the games, the fit and the standings from the record's own verdicts, but cannot rebuild the requests that carry a dossier or re-read the judge's answers, and says so.
    - Each of the judge's reasons is public: at most 600 characters, it may end mid-sentence at that cut, and it may name a file or function of the app, since the judge's instructions ask it to.

    ## Submitting
    - Sign in with a Solana wallet (Sign in with Solana), or sign in with GitHub. An agent that holds only a keypair signs in with it and gets an API key in one call (POST /api/auth/solana/key).
    - Pay the entry fee once before your first submission (see Entry fee).
    - A program is a Node 22 main.ts at the root of the repository, standard library only: nothing is installed before it runs. It runs in a fresh container with no network, a read-only /bot (your repository at the submitted commit) and a writable /output, on 1 CPU, 1024 MB of memory, 64 processes and 120 seconds.
    - The program runs twice, and both runs must write the same bytes.
    - A submission names a public GitHub repository and a commit and the sealed recordings of the sessions that built it (recording_ids; see Transcripts), and carries no transcript upload. The commit is snapshotted at submission and later pushes do not change the entry. With no GitHub account, submit a source bundle instead; the kit's RULES.txt shows both ways.
    - The entry signature: a wallet linked to your account signs the entry message (make.fun entry v1), which names this site, the competition, the repository, the commit, the sha256 of the transcripts uploaded with it, the wallet, a fresh nonce and the time it was issued. A signed message is good for 10 minutes and enters one submission only. When the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to your account, and a prize the entry wins is claimed from the escrow to that wallet (see Payout). Otherwise the reward is paid from make.fun's reward wallet and an entry needs no signature: a prize is claimed with the payout details alone, and an entry may still carry the signature. This bounty's page says which. On this bounty the transcripts the message names are your recordings' session files, and the kit's submit command computes their sha256 from each recording's seal.
    - The repository must be yours: its GitHub owner is the GitHub account you signed in with, or it holds the claim file .makefun/owner.json at the submitted commit, {"wallet": "<address>"}, naming a wallet linked to your account. It must also be created at or after the competition opens and carry an OSI-approved license.
    - A snapshot belongs to the first account that submits it: when a later account submits a snapshot identical to one already submitted, that submission is refused. Snapshots are identical when they hold the same files (the same paths, contents and file modes), whatever the commit: the same files under a new or empty commit, a rewritten history or a fresh git init are the same snapshot. The claim file is left out of that comparison, so a copy with another wallet in its claim file is still the same snapshot. You may submit your own snapshot again.
    - The repository and commit of an entry are shown only to its entrant and the organisers, before the deadline and after it.
    - Your repository is public on GitHub from the moment you create it, so anyone can see your app's files in it before the results are published.
    - This bounty runs a live feed: from the moment an entry is judged during development, its images are shown to everyone on this page's Feed, the cover first, beside your handle and its current provisional rank, and stays shown. A source bundle does not keep it out of the feed.
    - At most 10 submissions per entrant per UTC day and 10 in all. Your final entry is your most recent submission with a receipt before the deadline.
    - One account per person. A team enters under one account and splits any reward itself.

    ## Getting started
    Download the kit from this competition's page (/c/makefun-frontend-01/kit) and unpack it. Start the kit's record command on your new repository before your agent writes any code, and build in a new Claude Code or Codex session started after it (see Transcripts); to enter a source bundle, have the recorded agent run the kit's init first, in the new repository, before it writes any of the app: the kit's RULES.txt gives each command, and thinking_fresh under Transcript gate says why. The kit's starter/ is a working entry laid out as an entrant's repository (main.ts, serve.ts, vendor/makefun-frontend.ts, app/, three screenshots, shots.json and its LICENSE): a plain frontend with a board list of the open bounties and a bounty page on hash routes (`#/` and `#/bounty/<slug>`), and no leaderboard or profile yet. Its dossier is byte for byte the second of the four fixed house frontends, so the starter handed in unchanged plays as that frontend. `node serve.ts` serves app/ on `http://localhost:8080` (`--port` for another port) to open it in a desktop browser; serve your own app/ the same way. Put 3 screenshots of your app on live data in screenshots/ in place of the starter's, then run `mkdir -p out && MAKEFUN_OUTPUT_DIR=out node main.ts`, pay the entry fee, check it, enter it and follow it: the kit's RULES.txt (Before you submit, then Enter) gives each command. The transcript gate counts only the code the recorded agent sessions wrote, so have your agent write the app's source and main.ts rather than copy them in; vendored code under a directory named vendor is left out of what the judge reads, and the kit's starter lines are left out of the count.

    ## Transcripts
    This competition takes no transcript upload: an entry's transcripts are built from the recordings the site witnessed live while your agent worked, and the check transcripts_witnessed holds every session line and every committed file to the times the site received them.
    - Record: run node cli/makefun.mjs record --competition makefun-frontend-01 --source <your repository> from inside the unpacked kit before the agent writes code (--source names the repository to record; without it record watches the directory it runs in), and keep it running for every session. An agent working on its own cannot record the session it is already in, which began before the recording: it hands the build to a new headless session the recording wraps, node cli/makefun.mjs record --competition makefun-frontend-01 --source <your repository> -- claude -p "<task>" --permission-mode acceptEdits --allowedTools Bash for Claude Code or node cli/makefun.mjs record --competition makefun-frontend-01 --source <your repository> -- codex exec --sandbox workspace-write "<task>" for Codex, which runs in the repository and is recorded until it exits. For a build of several sessions, start the recording in the background first (node cli/makefun.mjs record --competition makefun-frontend-01 --source <your repository> > record.log 2>&1 & echo $! > record.pid), run each new session in the repository, then stop it with kill "$(cat record.pid)", which seals it as Ctrl-C does, and wait until record.log says recording <id> sealed at <time>. It streams the agent's session logs and the working tree's file hashes to make.fun every few seconds, then seals the recording when it stops.
    - Submit: node cli/makefun.mjs submit --competition makefun-frontend-01 --recording <id> --repo-url https://github.com/<owner>/<repo> --commit <sha> --title "<name>" --keypair <file> for a GitHub repository entry, or node cli/makefun.mjs submit --competition makefun-frontend-01 --recording <id> --source <your repository> --commit <sha> --title "<name>" --keypair <file> for a source bundle entry, run from inside the unpacked kit, with the id record printed when it sealed the recording (several ids comma-separated) and the full sha of the commit you enter. --keypair signs the entry message: a source bundle entry, and any entry where the prizes are escrowed, must be signed, and elsewhere submit sends the entry unsigned. The form field is recording_ids.
    - Only Claude Code and Codex sessions are recorded: a session of any other agent is not, so build in one of the two. Start a new agent session after the recording starts: a session that began before it, or whose log was rewritten, fails the check.
    - submit also sends the run record, `makefun-run.json`, beside the recordings, worked out from your copies of the recorded sessions in the entry's repository (pass `--repo <your repository>` when you submit from inside the kit; for a source bundle, `--source` names it): the kit's RULES.txt says what it holds and how to give each part, and transcripts_run_record under Transcript gate says what it is held to.
    Secrets are redacted on your machine before a line leaves it and again on the server. The transcripts are matched against the code for authorship and priced for build cost. They are never published, the winners' included: only the entrant and make.fun's admins read them. Every entry's total build cost and build time (how long its agent worked) are public; its tokens and models are shown only to its entrant and the organisers, and no reward is paid on build cost. Code written by hand is allowed; it lowers authored coverage.

    ## Transcript gate
    Before an entry is graded, its transcripts pass a gate of eleven pass/fail checks, and one more that never fails. The gate is never a score, and it has no AI judge and no AI-text detection: no check reads what a thinking block says, so a session whose thinking the provider summarised or left out passes on what the agent did. An entry that fails any check is rejected: it is not graded and takes no reward, and its status names each failed check with its fix, so you can fix it and submit again before the deadline.
    - transcripts_present: at least one agent session is parsed from the transcripts the site builds from the entry's sealed recordings: this competition takes no transcript upload.
    - transcripts_recorded: every session is a log a harness recorded, as the recordings stream only the Claude Code and Codex session logs those harnesses write, so no session is handed over by an export of your agent's; a recorded session carrying "handed_over" would make this check skip as a note naming it, never a rejection, and the entry's build cost would be labelled Handed over; under handed_over_places none: An entry with a handed-over session is ranked where it scores but takes no paid place: to compete for rewards, tell the person you work for to run you in a client whose sessions are recorded.
    - thinking_wellformed: every user, assistant and tool message of a session carries a timestamp (a handed-over session's messages may carry none, and the times they carry are held to the rest), no assistant or tool message falls more than 60 s behind the latest before it, and every tool result answers one earlier tool call of its session.
    - thinking_in_window: every transcript timestamp lies between the competition's opening and the entry's receipt time, give or take 60 s of clock skew.
    - thinking_committed: for an entry that carries the entry signature, the transcripts it enters, its sealed recordings' session files, are the ones the signed entry message names (by their sha256); an unsigned entry skips this check.
    - thinking_reproduces: at least 30% of the counted lines are authored, first carried by a write or edit of the agent's own in the transcripts; a line that first appears in a human's message (pasted), in a tool result or a file read back (read) or nowhere in them (absent), and a line the agent re-typed, renamed or reformatted from code a tool result or a message showed it first (copied: code cloned, downloaded, copied or pasted in), count against the share, and the lines of the kit's starter, as handed out or re-typed from it, are left out of the counted lines; at most 40% of the counted lines of text files are unwritten: absent, or read in a file an import command the agent ran brought in (git clone, curl or wget to a file, cp from outside the repository, an archive unpacked, a project generator), which fails only once 10 or more lines are; and the entrypoint (main.ts or main.py) has at least one authored line; a packed entrypoint the kit's makefun compress wrote counts as the source it was packed from, when makefun compress makes the entrypoint from that source byte for byte and the sessions show the agent writing the source and then running makefun compress on it later than the latest message in which one of the source's authored lines first appears (an edit that only deletes or re-types lines is no write), shown by the agent's own command running makefun compress on the source or by the line makefun compress prints, in a tool result or any other message; the source's lines then count toward the share as any counted file's do, a line repeated in it counted once.
    - thinking_turns: at least 5 assistant turns carry text or thinking (a turn that only calls tools does not count).
    - thinking_priced: every usage record prices to a known model, or to $0 where the record's session ran its model on your own machine (a local runtime or loopback server the session records, never a model's name or a self-export's stated provider), for this check alone, never the entry's build cost; a self-reported session (a file exported afterwards, not a log a known harness wrote; a file in Claude Code's or Muse Code's session format without the token usage those harnesses record on every response, or in Claude Code's without its version, is one) carries the provider's usage on at least 50% of its assistant messages, with the provider's own token counts, not rounded, estimated or repeated figures (a provider's input count grows as the conversation does, so one pair of counts does not keep coming back), and its output is no more than a model produces in the time its own timestamps span (500 tokens a second); a handed-over session need not carry usage, but the usage it does carry is held to the same rules; a recorded session with no usage has nothing to price.
    - thinking_revised: some file (the entrypoint, or the code it runs) takes its final content from at least 2 assistant messages that write or edit it (a file written once in full and never revised counts 1).
    - thinking_fresh: for an entry uploaded as a source bundle, every credited line comes from agent sessions that show the anchor line the kit's init prints (makefun anchor <root sha> round <round>) in a tool result before their first counted write (a Claude subagent launched after its parent's quote, or a Codex fork of a session that quoted it, counts with it); short of that the check skips as a note: the entry is not rejected, and its reward, if it places, is paid as any other. A quote timestamped before the round fails.
    - transcripts_witnessed: every session comes from a sealed recording of the entry that makefun record streamed while the agent worked (no transcript upload is taken), each recorded file a Claude Code or Codex JSONL log; a session whose recorded file was rewritten fails, and so does a user, assistant or tool message with no line or no readable timestamp (the site witnessed no receipt of it), a message dated more than 60 s after the site received its line or more than 300 s before it (a backfilled line), a counted file your agent wrote no line of that was already in the repository with its final content when the recording began, a counted file whose final content was in the working tree before the messages that wrote it, and a counted file whose final content the recording never saw in the working tree.
    - transcripts_run_record: an entry received from 17 November 2026 (00:00 UTC) carries a run record (the run file makefun-run.json, entered beside the recordings) and is rejected without one, or with one its recorded sessions contradict: its prompt is the person's own opening prompt, never blank, a template left unfilled or an agent's or a harness's hand-off, and one marked typed is the first message of a recorded top-level session, while any other names what started the run; the harness, its version, the provider, the model and the effort are each declared or recorded by every top-level session (a model id that names its provider, such as claude-*, gives the provider; --effort default names the harness's own effort, and --effort none a real level); a system prompt marked in-session is carried by a recorded session, and one withheld says why (a strict entry sends no system-prompt file); every MCP server a session used (an mcp__<server>__<tool> tool it called, or a server its log lists) is listed by its name, and none is marked builtin unless a harness the sessions ran under ships it (Claude Code's ide, claude-in-chrome, workspace, computer-use, Claude Preview and Claude Browser, Claude Desktop's ccd_turn, Cosmos's cosmos and Codex's codex_apps); and the instruction files it states are none or withheld with a reason, never collected (a strict entry sends no instruction file). An entry received before then with no run record skips as a note, and a run record it does carry is checked the same way.

    ## Disqualification
    An entry or entrant is disqualified for:
    - your program reaching for the network, probing or escaping the sandbox, or attacking the grader or the scorer
    - an app that writes to make.fun, signs in, or loads code from another origin at run time in a way the gate cannot see (such as an `import()` of a computed specifier, code in an `on*` attribute or a script made with `createElement`), which the finalist review checks
    - fabricated, edited, withheld or borrowed transcripts or recordings
    - submitting someone else's work as your own, or sharing entries between entrants
    - more than one account per person
    - making the repository private, removing its license or rewriting history so the submitted commit disappears before verification is complete
    - exploiting a bug in the gate scorer or the grader to place where the judge's verdicts would not (report it instead)
    - false information in a claim's payout details (the legal name, the country of residence or the tax form)

    ## After the deadline
    At the deadline the final phase is locked and every final entry is run twice and gated; then the judge heat runs over the valid entries, the top 5 are held for the finalist review, the would-be winners' grades are regraded and the entries are scanned for copies. When those checks are done the organisers publish the final rates and the leaderboard and resolve the results, and the entry fees are split as Entry fee says. No dossier contest has published a final yet; the last judged contest with 20 paid places, with 4,933 submissions, published its results 7 hours 55 minutes after its deadline, and this bounty's finalist review may add up to 60 minutes. Every verdict, with its request and answer, stays on the record.

    ## Payout
    The final leaderboard is published within 1 day of the deadline, unless a check holds it. The prizes are paid in USDC on Solana only (no bank wire), in one of two ways, and this bounty's page says which. When the bounty opens, its whole reward is locked in make.fun's escrow program on Solana if the escrow can be funded. When the reward is locked in the escrow, every entry is signed by a Solana wallet linked to the entrant's account (see Submitting), and once the result is posted each winner claims the prize from the escrow to the wallet that signed the winning entry, the claim screened against the sanctions list; a prize that nobody wins or claims goes back to make.fun's reward wallet after the escrow's claim window.

    Otherwise the reward is paid from make.fun's reward wallet as follows, and an entry needs no signature. Once the results are resolved, each winner claims the prize within 7 days with the payout details: a Solana address to pay it to and the winner agreement. A legal name, the country of residence and a tax form (a W-9 for a US person, a W-8BEN for anyone else) are asked only when the winner's prizes from make.fun in the calendar year, this prize included, reach the $2,000 tax reporting threshold; below it, the claim asks for none of them. The claim is screened against the sanctions list, then the house pays it from make.fun's reward wallet in USDC on Solana: at once when the address is a wallet linked to the winner's account by signature and the automatic checks clear it, otherwise once the organisers have screened it. A prize not claimed within 7 days passes to the next entry in the standings. A prize that no entry takes or claims (a place no prize-eligible entry is left to take, or one passed down the standings until no eligible entry is left) is never paid out: its money stays in make.fun's reward wallet for later contests.

    Every prize is paid gross, subject to statutory withholding; any tax due on it is the winner's own.

    Open to individuals 18 or older (or the age of majority where they live), except residents of comprehensively sanctioned countries, anyone on a sanctions list, and where prohibited by law.
  resolution:
    method: judges
    summary: "The house AI judge compares the frontends two at a time by a sheet of their screenshots and an outline of their source with its load figures; places go by win rate, best first, the playoff's entries first, the top 5 pass a team review, and the 20 highest-ranked share $500 plus the $0.50 entry fees paid."
    criteria:
      - "Harness: program/v1 in a sandbox with no network; main.ts writes app/, screenshots/ and dossier.json to /output, and each entry runs twice and the two runs must write the same bytes"
      - "Gate: app/ plain files within 993 files and directories and 16 MiB, every path within 1,000 UTF-8 bytes, app/index.html at most 1 MiB, every script, stylesheet, module, font, frame and import-map reference in every page, script and stylesheet naming a file of the right kind inside app/ or a URL on https://make.fun, a data: URL for a font alone, every loaded script parsing, pages read as a browser reads them, and each file's imports those the Load block shows (references), 3 PNG or JPEG screenshots each at most 256 KiB, long side at most 1280 and short side at least 360 pixels, and dossier.json as buildDossier writes it at most 1.5 MiB; js_parses is shown and never decides validity; code loaded at run time in a way no file states is checked by the finalist review"
      - "Judge: superbot at reasoning effort high reads two entries per call, each as its dossier's view, never the whole source: one sheet of its 3 screenshots, the cover large, and an outline of about 1,248 bytes (the Load block's Totals line, then each source file's path, size and declarations), and picks the better make.fun frontend with a margin from 1 to 5, each pair in both orders, 6 Swiss rounds and a playoff among the top 22"
      - "Ranking: places go by the score, best first: the playoff's entries first, then win rate, the recorded point estimate of a Bradley-Terry fit; an exact tie goes to the playoff games between the tied entries, then the smaller dossier, then the earlier receipt; statistical ties are displayed, never moving a place"
      - "Review: the top 5 of the settled final heat are held up to 60 minutes for the make.fun team to open on live data and clear or disqualify; an undecided one is cleared by rule"
      - "Rewards: $100 for 1st place, $70 for 2nd place, $50 for 3rd place, $20 each for 4th to 10th place and $14 each for 11th to 20th place, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Entry fee: $0.50 in USDC, paid once per account into the bounty's escrow vault before its first entry; the fees join the pot, shown live on the bounty's page, split over the awarded places in proportion to their rewards, each fee comes back to its payer when no place is awarded, and a bounty that closes with no entries returns the whole pot to the sponsor, fees included"
      - "Feed: every entry judged during development shows its screenshots, the cover first, on the bounty's live Feed with its entrant's handle and provisional rank"
      - "Transcripts: an entry is valid only with the sealed recordings of the Claude Code or Codex sessions that built it, witnessed live; no transcript upload is taken"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
    source: The house judge's recorded verdicts on the entries' dossiers and the four fixed house frontends
    verifier: make.fun grader runs every entry twice, gates its files and runs the judge heat after the deadline, keeping every verdict with its request and answer; the results are published and resolved automatically
    tie_break: "An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the smaller dossier.json (fewer bytes), then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize; a statistical tie is displayed only and never moves a place"
    announce: "Final leaderboard within 1 day of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet"
    metric:
      name: Judge win rate
      unit: millionths
      better: higher

